
name: Dependency Security Lab

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check install-demo.js

      - name: Run security tests
        run: node --test tests/security.test.js

      - name: Prepare demo artifact
        run: |
          mkdir -p dist
          cp install-demo.js dist/app.js

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: demo-app
          path: dist/
          if-no-files-found: error
      - name: Simulate modification after testing
        run: |
          echo "console.log(Modified after testing passed)"; >> dist/app.js

  deploy-demo:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: demo-app
          path: received/

      - name: Inspect received artifact
        run: |
          echo "Files received:"
          ls -la received/
          echo "Application contents:"
          cat received/app.js
